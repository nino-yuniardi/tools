<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>The Nudge · Nino Studio</title>
<meta content="Name what's in the way today, get a five-minute dare, and grow a tree one made thing at a time. A small tool for artists by Nino Studio." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;height:100%;background:#F4EEE6}
body{overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',Georgia,serif;color:#2E2C29;-webkit-font-smoothing:antialiased}
body.desk{background:#EFEBE4}
#wrap{position:relative;flex-shrink:0}
body.desk #wrap{border-radius:28px;box-shadow:0 1px 2px rgba(46,44,41,.06),0 24px 60px -24px rgba(46,44,41,.35);overflow:hidden}
#frame{width:390px;height:844px;position:relative;overflow:hidden;background:#F4EEE6;transform-origin:0 0;touch-action:auto;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
a{color:#2E2C29}a:hover{color:#6E6962}
.alltools{z-index:3}
button{cursor:pointer;font-family:'Newsreader',Georgia,serif;color:#2E2C29}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2E2C29;outline-offset:3px}
p{text-wrap:balance}
.abs{position:absolute}
.scr{position:absolute;inset:0}
.pill{height:56px;border:none;border-radius:28px;background:#2E2C29;color:#F4EEE6;font-size:15px;letter-spacing:.02em}
.ghost{height:46px;border:none;background:transparent;font-size:14px}
.iconbtn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.kick{font-size:11px;font-weight:700;letter-spacing:.06em;color:#6E6962}
@keyframes nIn{from{opacity:0}to{opacity:1}}
@keyframes nBreathe{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-3px,2px)}}
@keyframes nBloom{0%{opacity:.45;transform:translate(0,0) scale(.94)}50%{opacity:1}100%{opacity:.8;transform:translate(4px,-3px) scale(1.07)}}
@keyframes nTint{0%{filter:saturate(.85) hue-rotate(-8deg)}100%{filter:saturate(1.2) hue-rotate(8deg)}}
@keyframes nHint{0%,55%,100%{transform:translateX(0)}20%{transform:translateX(-46px)}38%{transform:translateX(0)}}
@keyframes nArrow{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(6px);opacity:1}}
@keyframes nSway{0%{transform:rotate(-.8deg)}100%{transform:rotate(.8deg)}}
@keyframes nLeaf{0%{opacity:.6;transform:scale(.92)}100%{opacity:1;transform:scale(1.08)}}
@keyframes nGrow{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes nRain{0%{transform:translateY(-120px);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateY(150px);opacity:0}}
@keyframes nSoak{0%{opacity:0}40%{opacity:.7}100%{opacity:.35}}
@keyframes nLift{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes nHover{0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-5px)}}
@keyframes nFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.5)}}
@keyframes nPeck{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(22deg)}90%{transform:rotate(0)}}
@keyframes nPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes nHop{0%,80%,100%{transform:translateY(0)}86%{transform:translateY(-3px)}92%{transform:translateY(0)}}
@keyframes nPop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
.scr.in{animation:nIn 600ms ease-out both}
.breathe{animation:nBreathe 14s ease-in-out infinite alternate,nTint 18s ease-in-out infinite alternate;transform-origin:50% 50%;transform-box:view-box}
.breathe ellipse{animation:nBloom var(--d,10s) ease-in-out var(--dl,0s) infinite alternate;transform-origin:center;transform-box:fill-box}
.hint{animation:nHint 2600ms ease-in-out 1200ms 2 both}
.arrow{animation:nArrow 1600ms ease-in-out infinite}
.sway{animation:nSway 9s ease-in-out infinite alternate;transform-origin:150px 324px}
.leaf{animation:nLeaf var(--d,9s) ease-in-out var(--dl,0s) infinite alternate;transform-origin:center;transform-box:fill-box}
.leaf.grow{animation:nGrow 1600ms cubic-bezier(.3,.7,.3,1) both}
.rain{animation:nRain 1500ms ease-in var(--dl,0s) both;transform-box:fill-box}
.soak{animation:nSoak 2400ms ease-out both}
.lift{animation:nLift 700ms ease-out both}
.hover{animation:nHover 5s ease-in-out var(--dl,0s) infinite}
.flap{animation:nFlap 520ms ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.hop{animation:nHop 5s ease-in-out var(--dl,0s) infinite}
.pop{animation:nPop 500ms cubic-bezier(.3,.7,.3,1) both;transform-origin:50% 100%;transform-box:fill-box}
.peck{animation:nPeck 4.5s ease-in-out var(--dl,0s) infinite;transform-origin:30% 100%;transform-box:fill-box}
.pulse{animation:nPulse 1.8s ease-in-out infinite}
.peek{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;position:relative;cursor:pointer}
.peek::-webkit-slider-runnable-track{height:4px;background:transparent}
.peek::-moz-range-track{height:4px;background:transparent}
.peek::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#F4EEE6;border:1.5px solid #2E2C29;margin-top:-10px;box-shadow:0 2px 6px rgba(46,44,41,.18)}
.peek::-moz-range-thumb{width:22px;height:22px;border-radius:12px;background:#F4EEE6;border:1.5px solid #2E2C29}
#canopy ellipse{transition:rx 600ms ease,ry 600ms ease}
#hintwrap{overflow:hidden}
#dareSwipe{margin-top:12px;min-height:110px;flex-shrink:0;overflow:hidden}
#dareTrack{display:flex}
#dareTrack>div{flex:0 0 100%;min-width:0;min-height:110px}
.dare-side{display:none}
.dare-copy{margin:0;font-weight:400;font-size:27px;line-height:1.3;letter-spacing:-.005em}
#pickBackdrop{display:none}
#dots .page-dot{display:flex;align-items:center;justify-content:center;width:18px;height:28px;padding:0;border:0;background:transparent}
#dots .page-dot span{display:block;height:5px;border-radius:3px;transition:width 300ms ease,background 300ms ease}
#track{width:calc(var(--pw,390px)*8);height:var(--ph,844px)}
.panel{position:relative;width:var(--pw,390px);height:var(--ph,844px);flex-shrink:0;overflow:hidden}
.panel>svg{position:absolute;inset:0;width:100%;height:100%}
#dareArt{width:100%;height:100%}
.edge{display:none;position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;border:1px solid #CFC8BC;background:rgba(250,248,244,.88);align-items:center;justify-content:center;padding:0;z-index:2}
.edge-l{left:12px}.edge-r{right:12px}
.td{display:none}
/* The artwork fills the viewport; only the content has a centered reading width. */
body.wide{--content-inset:max(64px,calc((100% - 600px)/2));--page-inset:max(40px,calc((100% - 1120px)/2))}
body.wide .edge{display:flex}
body.wide .edge:hover{background:#F4EEE6}
body.wide #prevBtn,body.wide #nextBtn{display:none}
body.wide .tt{display:none}
body.wide .td{display:inline}
body.wide #s-dare .iconbtn{border:1px solid #CFC8BC;border-radius:50%;width:52px;height:52px}
body.wide #wrap{border-radius:0;box-shadow:none}
body.wide .alltools{left:var(--page-inset)!important;top:18px!important}
body.wide .phead{padding:40px var(--page-inset) 0!important}
body.wide .pq{left:var(--content-inset)!important}
body.wide .pctl{left:var(--content-inset)!important;right:var(--content-inset)!important;width:auto;bottom:40px!important}
body.wide .pgrad{top:0!important;height:auto!important;background:linear-gradient(to bottom,rgba(250,248,244,0) 15%,rgba(250,248,244,.65) 60%,rgba(250,248,244,.96))!important}
body.wide .ptext{left:var(--content-inset)!important;right:var(--content-inset)!important;bottom:220px!important}
body.wide .ph1{font-size:clamp(64px,6.5vw,88px)!important}
body.wide .pp{font-size:18px!important;max-width:520px!important}
/* One centered content stack; the art is a separate, full-screen background layer. */
body.wide #s-dare{box-sizing:border-box;padding:64px 40px 40px;overflow-x:hidden;overflow-y:auto;isolation:isolate}
body.wide #s-dare:not([hidden]){display:grid!important;grid-template-columns:minmax(0,600px);grid-auto-rows:max-content;justify-content:center;align-content:safe center;row-gap:28px}
body.wide #dareArtBox{display:contents}
body.wide #dareArt{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
body.wide .dgrad{inset:0!important;height:100%!important;width:100%;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(250,248,244,.25),rgba(250,248,244,.88) 35%,rgba(250,248,244,.96))!important}
body.wide #dareArtBox>button{z-index:2}
body.wide .dtitle{position:relative;inset:auto!important;grid-column:1;grid-row:1;min-width:0}
body.wide .dtitle h2{font-size:56px!important}
body.wide .dcol{grid-column:1;grid-row:2;min-width:0;width:100%;padding:0!important;flex-grow:0!important}
body.wide #reframe{font-size:26px!important}
body.wide #dareText{font-size:36px!important}
body.wide .dctl{margin-top:48px!important}
body.wide #s-timer{padding-left:max(26px,calc(50% - 280px))!important;padding-right:max(26px,calc(50% - 280px))!important}
body.wide #timerDare{font-size:26px!important;max-width:520px!important}
body.wide .tbtns{width:360px;align-self:center!important}
body.wide #s-tree:not([hidden]){display:grid!important;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr 1fr;column-gap:48px;padding:40px var(--page-inset) 48px!important}
body.wide #treeHead{grid-column:1/-1}
body.wide #treeArt{grid-column:1;grid-row:2/4;margin:0!important;align-self:center}
body.wide #treeArt svg{width:100%;height:auto;max-height:72vh}
body.wide #treeText{grid-column:2;grid-row:2;align-self:end}
body.wide #treeBtns{grid-column:2;grid-row:3;margin-top:28px!important;align-self:start}
@media (prefers-reduced-motion:reduce){.breathe,.breathe ellipse,.hint,.arrow,.sway,.leaf,.hover,.flap,.peck,.pulse{animation:none}}

/* Paper card language: warm watercolor paper, light serif, condensed small caps */
body{font-weight:300;font-size:17px}
body.desk{background:#E9E2D6}
body.desk #wrap{border-radius:40px}
[style*="font-weight:600"],[style*="font-weight:700"],[style*="font-weight:bold"]{font-weight:400!important}
.kick,.pq,p.abs[style*="letter-spacing:.06em"]{font-family:'Barlow Condensed',sans-serif!important;font-weight:500!important;font-size:13px!important;letter-spacing:.2em!important;text-transform:uppercase}
.pq::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#D6361F;margin-right:10px;vertical-align:1px}
.pill{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:17px;letter-spacing:.18em;text-transform:uppercase;background:#1F1C18;height:60px;border-radius:30px}
.ghost,.alltools{font-family:'Barlow Condensed',sans-serif!important;font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:12px!important}
.phead span:first-child{font-weight:300!important;font-size:34px!important;letter-spacing:-.03em!important}
h1,h2,h3{font-weight:300;letter-spacing:-.025em}
</style>
<style>@media (max-width:767px){
  /* Mobile uses real viewport dimensions, not a transformed desktop canvas. */
  #s-pick:not([hidden]){display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;isolation:isolate}
  #pickBackdrop{display:block;position:absolute;inset:0;z-index:-1;pointer-events:none}
  #pickBackdrop svg{display:block;width:100%;height:100%}
  #pickBackdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(250,248,244,0),rgba(250,248,244,.82) 70%,rgba(250,248,244,.96))}
  #s-pick .phead{position:relative;inset:auto!important;grid-row:1;padding:44px 24px 0!important;min-width:0}
  #s-pick .pq{position:relative;inset:auto!important;grid-row:2;margin:22px 28px 12px!important}
  #hintwrap{position:relative;inset:auto!important;grid-row:3;min-width:0;min-height:0;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;touch-action:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #hintwrap.hint{animation:none}
  #hintwrap::-webkit-scrollbar,#dareSwipe::-webkit-scrollbar{display:none}
  #track{width:100%;height:100%}
  .panel{box-sizing:border-box;flex:0 0 100%;width:100%;height:100%;min-width:0;display:flex;flex-direction:column;padding:20px 28px 24px;overflow-x:hidden;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always}
  .panel>svg,.panel>.pgrad{display:none}
  .panel .ptext{position:relative;inset:auto!important;flex:0 0 auto;margin-top:auto}
  .panel .ph1{font-size:clamp(44px,16vw,64px)!important}
  #s-pick .pctl{position:relative;inset:auto!important;grid-row:4;min-width:0;margin:0 24px;padding:16px 0 max(24px,env(safe-area-inset-bottom,0px));gap:16px!important}
  /* Dares take their natural height; the whole screen scrolls on short phones. */
  #s-dare{overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain}
  #s-dare .dcol{box-sizing:border-box;flex:1 0 auto!important;width:100%;min-width:0}
  #dareSwipe{width:100%;min-width:0;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;touch-action:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #dareTrack{width:100%;align-items:stretch}
  #dareTrack>div{box-sizing:border-box;flex:0 0 100%;min-width:0;min-height:0;scroll-snap-align:start;scroll-snap-stop:always}
  .dare-side{display:block}
  #s-dare .dctl{margin-top:28px!important}
}</style></head>
<body>
<div id="wrap">
<div id="frame">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wash" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" result="bleed"/>
      <feGaussianBlur in="bleed" stdDeviation="6" result="soft"/>
      <feGaussianBlur in="bleed" stdDeviation="1.5" result="edge"/>
      <feComponentTransfer in="edge" result="edgeFaint"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="edgeFaint"/></feMerge>
    </filter>
    <filter id="dab" x="-80%" y="-80%" width="260%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="bleed"/>
      <feGaussianBlur in="bleed" stdDeviation="1.6" result="soft"/>
      <feGaussianBlur in="bleed" stdDeviation="0.4" result="edge"/>
      <feComponentTransfer in="edge" result="edgeFaint"><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="edgeFaint"/></feMerge>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.25" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.3"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.33  0 0 0 0.07 0"/>
    </filter>
  </defs>
</svg>

<!-- PICK -->
<section id="s-pick" class="scr in">
  <div id="pickBackdrop" aria-hidden="true"><svg id="pickArt" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div id="hintwrap" class="hint abs" style="inset:0">
    <div id="track" style="display:flex"></div>
  </div>
  <a href="../" class="abs alltools" style="top:14px;left:28px;font-size:12px;color:#55514B;text-decoration:none">← All tools</a>
  <button class="edge edge-l" id="edgeL" data-act="prev" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E2C29" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="edge edge-r" id="edgeR" data-act="next" aria-label="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E2C29" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="abs phead" style="top:0;left:0;right:0;padding:44px 24px 0;display:flex;justify-content:space-between;align-items:center">
    <span style="font-weight:600;font-size:20px;letter-spacing:-.01em">nudge</span>
    <button data-act="tree" id="treeBtn" style="height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700">
      <span id="leafCount">0</span>
      <svg width="22" height="24" viewBox="0 0 22 24" fill="none" aria-hidden="true"><path d="M11 23V11M11 15c-2-1.5-4-2-6-2M11 13c2-1.5 4-2.5 6-3" stroke="#2E2C29" stroke-width="1.1" stroke-linecap="round"/><ellipse cx="11" cy="7" rx="4.5" ry="4" fill="#9DB894" opacity=".85"/><ellipse cx="5" cy="12" rx="3" ry="2.6" fill="#D99A7E" opacity=".8"/><ellipse cx="17.5" cy="9" rx="3" ry="2.6" fill="#7D93B5" opacity=".8"/></svg>
    </button>
  </div>
  <p class="abs pq" style="top:112px;left:28px;margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;color:#3F3C37">WHAT'S IN THE WAY TODAY?</p>
  <div class="abs pctl" style="left:24px;right:24px;bottom:34px;display:flex;flex-direction:column;gap:22px">
    <button class="pill" data-act="choose" id="chooseBtn">This is it</button>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="iconbtn" data-act="prev" id="prevBtn" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E2C29" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div id="dots" role="group" aria-label="Choose what's in the way" style="display:flex;gap:2px;align-items:center"></div>
        <span id="swipeHint" style="display:flex;align-items:center;gap:6px;font-size:12px;color:#55514B"><span class="tt">Swipe to see what else</span><span class="td">Use the arrows to see what else</span> <svg class="arrow" width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#55514B" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M1 5h11M8 1l4 4-4 4"/></svg></span>
      </div>
      <button class="iconbtn" data-act="next" id="nextBtn" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E2C29" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</section>

<!-- DARE -->
<section id="s-dare" class="scr" hidden style="display:flex;flex-direction:column">
  <div id="dareArtBox" style="position:relative;height:var(--artH,300px);flex-shrink:0">
    <svg id="dareArt" viewBox="0 0 160 120" width="390" height="300" preserveAspectRatio="xMidYMid slice" style="display:block" aria-hidden="true"></svg>
    <div class="abs dgrad" style="left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,rgba(250,248,244,0),#F4EEE6)"></div>
    <button data-act="back" aria-label="Back" class="abs" style="top:40px;left:16px;width:44px;height:44px;border-radius:22px;border:none;background:rgba(250,248,244,.85);display:flex;align-items:center;justify-content:center;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E2C29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="abs dtitle" style="left:28px;right:28px;bottom:10px"><h2 id="dareTitle" style="margin:0;font-weight:300;font-size:40px;line-height:1;letter-spacing:-.02em"></h2></div>
  </div>
  <div class="dcol" style="flex-grow:1;padding:18px 28px 34px;display:flex;flex-direction:column">
    <p id="reframe" style="margin:0;font-weight:300;font-size:21px;line-height:1.4;color:#3F3C37"></p>

  if (innerWidth < 768 || e.pointerType === 'touch') return;
  startDrag(e.clientX, e.target);
});
document.addEventListener('pointermove', function (e) {
  if (innerWidth < 768 || e.pointerType === 'touch') return;
  moveDrag(e.clientX);
});
function endDrag() {
  if (!active) return;
  active = false;
  var dx = drag;
  dragging = false; drag = 0;
  if (!moved) return;
  setTimeout(function () { moved = false; }, 50);
  if (S.screen === 'pick') {
    if (dx < -60) go(S.idx + 1);
    else if (dx > 60) go(S.idx - 1);
    else updatePick();
  } else if (S.screen === 'dare') {
    if (Math.abs(dx) > 70) swapDare(dx < 0 ? 1 : -1);
    else { card.style.transition = 'transform 380ms cubic-bezier(.2,.8,.3,1), opacity 380ms ease'; setCard(0, 1); }
  }
}
['pointerup', 'pointercancel'].forEach(function (n) {
  document.addEventListener(n, function (e) { if (e.pointerType !== 'touch') endDrag(); });
});


addEventListener('keydown', function (e) {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  var dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!dir) return;
  if (S.screen === 'pick') { e.preventDefault(); go(S.idx + dir); }
  else if (S.screen === 'dare') { e.preventDefault(); swapDare(dir); }
});

/* ---------- fit to screen ---------- */
function fit() {
  var wide = innerWidth >= 768, w = $('wrap'), fw, fh;
  if (wide) { K = 1; fw = innerWidth; fh = innerHeight; frame.style.transform = 'none'; }
  else {
    K = 1;
    fw = innerWidth;
    fh = innerHeight;
    frame.style.transform = 'none';
  }
  W = fw;
  frame.style.width = fw + 'px'; frame.style.height = fh + 'px';
  frame.style.setProperty('--pw', fw + 'px'); frame.style.setProperty('--ph', fh + 'px');
  frame.style.setProperty('--artH', Math.max(150, Math.min(300, fh - 400)) + 'px');
  frame.style.setProperty('--txtB', Math.max(168, Math.min(196, fh - 440)) + 'px');
  w.style.width = Math.round(fw * K) + 'px'; w.style.height = Math.round(fh * K) + 'px';
  document.body.classList.toggle('wide', wide);
  document.body.classList.toggle('desk', !wide && innerWidth > 520);
  updatePick();
  pickScroller.set(wide ? 0 : S.idx);
  if (S.screen === 'dare') refreshDareSwipe();
}
addEventListener('resize', fit);
fit();
updatePick();
})();
</script>
